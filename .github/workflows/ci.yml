name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Verify dependencies
        run: |
          go mod verify

      - name: Run go vet
        run: |
          go vet ./...

      - name: Run unit tests with race detector
        run: |
          go test -v -race ./...

      - name: Build binary
        run: |
          make pbx
